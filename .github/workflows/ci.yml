name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ankane/pgvector:v0.5.1
        env:
          POSTGRES_USER: reformly
          POSTGRES_PASSWORD: reformly
          POSTGRES_DB: reformly_support
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reformly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://reformly:reformly@localhost:5432/reformly_support?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      MOCK_LLM: "true"
      MOCK_EMBEDDINGS: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # pgvector's extension isn't enabled by default on a fresh container —
      # migrations that create the KnowledgeDocument.embedding column depend on it.
      - name: Enable pgvector extension
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=reformly psql -h localhost -U reformly -d reformly_support -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Prisma generate
        run: npm run prisma:generate --workspace=apps/api

      - name: Apply migrations
        run: npm run prisma:deploy --workspace=apps/api

      - name: Lint
        run: npm run lint --workspace=apps/api

      - name: Build
        run: npm run build --workspace=apps/api

      - name: Unit tests
        run: npm test --workspace=apps/api -- --ci

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build --workspace=apps/web

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # This is what actually catches a broken Dockerfile (missing OpenSSL
      # for Prisma's query engine, wrong build context, etc.) automatically
      # — before this job existed, that class of bug was only ever caught
      # by deploying by hand and watching it fail.
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t reformly-api:ci .

      # Only push what's actually going to be deployed — pushing on every
      # PR build would tag and upload an image for commits nothing ever
      # deploys. Building the same image twice (once here, once again in a
      # separate deploy job) used to double the build time/cost on every
      # push to master for no benefit; this job now does both in one pass.
      - if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: google-github-actions/setup-gcloud@v2

      - if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        name: Push image
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet
          docker tag reformly-api:ci asia-south1-docker.pkg.dev/reformly-support-copilot/reformly/api:${{ github.sha }}
          docker tag reformly-api:ci asia-south1-docker.pkg.dev/reformly-support-copilot/reformly/api:latest
          docker push asia-south1-docker.pkg.dev/reformly-support-copilot/reformly/api:${{ github.sha }}
          docker push asia-south1-docker.pkg.dev/reformly-support-copilot/reformly/api:latest

  deploy:
    needs: [api, web, docker-build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # Env vars (DATABASE_URL, REDIS_*, ADMIN_*, MOCK_LLM, ...) already live
      # on the Cloud Run service from prior manual setup and are preserved
      # across deploys that don't pass --set-env-vars/--update-env-vars.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy reformly-api \
            --image=asia-south1-docker.pkg.dev/reformly-support-copilot/reformly/api:${{ github.sha }} \
            --project=reformly-support-copilot \
            --region=asia-south1

      - name: Smoke test
        run: |
          sleep 5
          curl -sf --max-time 20 https://reformly-api-721473915245.asia-south1.run.app/health
